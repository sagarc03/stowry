version: "3"

includes:
  examples:
    taskfile: ./examples/Taskfile.yml
    dir: ./examples

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the stowry binary
    cmds:
      - go build -o bin/stowry .

  run:
    desc: Run the stowry server against ./data, keeping the metadata in stowry.db
    deps: [build, migrate]
    cmds:
      - ./bin/stowry serve --db-dsn stowry.db --storage-path ./data

  test:
    desc: Run tests, minus the end-to-end ones
    # internal/database's PostgreSQL cases use testcontainers; they skip
    # themselves when no container runtime answers.
    cmds:
      - go test ./internal/... ./types/... ./sign/...

  test:e2e:
    desc: Run end-to-end tests (needs Docker for the Postgres cases)
    cmds:
      - go test ./e2e/...

  test:all:
    desc: Run every test
    cmds:
      - go test ./...

  test:verbose:
    desc: Run every test with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Format, vet, lint, and test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  licenses:
    desc: Regenerate THIRD_PARTY_LICENSES from the module graph
    cmds:
      # 0.85 because modernc.org/mathutil's BSD text scores below the 0.9 default.
      - go-licenses save . --save_path=THIRD_PARTY_LICENSES --force --confidence_threshold=0.85

  licenses:check:
    desc: Fail if THIRD_PARTY_LICENSES is out of date
    cmds:
      - go-licenses save . --save_path=/tmp/stowry-licenses --force --confidence_threshold=0.85
      - diff -r THIRD_PARTY_LICENSES /tmp/stowry-licenses

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  docker:build:
    desc: Build every image variant locally, without pushing
    # The Dockerfiles copy per-platform binaries from GoReleaser's prepared
    # context, so `docker build .` at the repository root cannot work.
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  docker:run:
    desc: Run the snapshot image built by docker:build
    cmds:
      - docker run --rm -p 5708:5708 ghcr.io/sagarc03/stowry:latest-amd64 serve

  migrate:
    desc: Create the metadata schema in stowry.db
    deps: [build]
    cmds:
      - ./bin/stowry migrate --db-dsn stowry.db --storage-path ./data

  validate:
    desc: Check the metadata schema without changing it
    deps: [build]
    cmds:
      - ./bin/stowry validate --db-dsn stowry.db

