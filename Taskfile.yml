version: "3"

includes:
  examples:
    taskfile: ./examples/Taskfile.yml
    dir: ./examples

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the stowry binary
    cmds:
      - go build -o bin/stowry .

  run:
    desc: Run the stowry server
    deps: [build]
    cmds:
      - ./bin/stowry serve --config config.local.yaml

  test:
    desc: Run unit tests
    cmds:
      - go test ./internal/... ./types/... ./sign/...

  test:e2e:
    desc: Run end-to-end tests (needs Docker for the Postgres cases)
    cmds:
      - go test ./e2e/...

  test:all:
    desc: Run every test
    cmds:
      - go test ./...

  test:verbose:
    desc: Run every test with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Format, vet, lint, and test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t stowry:test .

  docker:test:
    desc: Build and run Docker container for testing
    deps: [docker:build]
    cmds:
      - docker run --rm -p 5708:5708 -e STOWRY_DATABASE_TYPE=sqlite -e STOWRY_STORAGE_PATH=/data stowry:test serve --db-dsn ":memory:"

  migrate:
    desc: Create the metadata schema
    deps: [build]
    cmds:
      - ./bin/stowry migrate --config config.local.yaml

  validate:
    desc: Check the metadata schema without changing it
    deps: [build]
    cmds:
      - ./bin/stowry validate --config config.local.yaml

