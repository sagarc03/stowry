# Server settings
server:
  port: 5708
  mode: store # store | static | spa

# Database settings
database:
  type: sqlite # sqlite | postgres
  dsn: stowry.db # file path for sqlite, connection string for postgres
  tables:
    meta_data: stowry_metadata # metadata table name

# Storage settings
storage:
  path: ./data # directory for file storage

# Server the client commands talk to
endpoint: http://localhost:5708

# Authentication
auth:
  read: public   # public | private
  write: public  # public | private
  aws:
    region: us-east-1
    service: s3
  # One key pair, also settable as STOWRY_ACCESS_KEY / STOWRY_SECRET_KEY
  access_key: AKIAIOSFODNN7EXAMPLE
  secret_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  keys:
    # file: /path/to/keys.json  # several pairs: [{"access_key": "...", "secret_key": "..."}]

# Cross-origin requests. Applies as soon as allowed_origins is set; there is
# no "enabled" key.
# cors:
#   allowed_origins: ["https://app.example.com"]
#   allowed_methods: [GET, PUT, DELETE, OPTIONS]
#   max_age: 300

# Logging
log:
  level: info # debug | info | warn | error
