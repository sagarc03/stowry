# Server settings
server:
  port: 5708
  mode: store # store | static | spa

# Database settings
database:
  type: sqlite # sqlite | postgres
  dsn: stowry.db # file path for sqlite, connection string for postgres
  tables:
    meta_data: stowry_metadata # metadata table name

# Storage settings
storage:
  path: ./data # directory for file storage

# Authentication
auth:
  read: public   # public | private
  write: public  # public | private
  aws:
    region: us-east-1
    service: s3
  # One key pair, also settable as STOWRY_AUTH_ACCESS_KEY / STOWRY_AUTH_SECRET_KEY
  access_key: AKIAIOSFODNN7EXAMPLE
  secret_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  keys:
    # file: /path/to/keys.json  # several pairs: [{"access_key": "...", "secret_key": "..."}]

# Logging
log:
  level: info # debug | info | warn | error
