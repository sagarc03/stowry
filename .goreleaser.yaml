version: 2

before:
  hooks:
    - go mod tidy
    - git diff --exit-code go.mod go.sum

builds:
  - id: stowry
    main: .
    binary: stowry
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: stowry
    ids:
      - stowry
    # Apache-2.0 dependencies require their licence to travel with the binary.
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES/**/*
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

dockers_v2:
  # The default image. Additional variants below differ only in base image and
  # tag suffix; each publishes a multi-platform index covering amd64 and arm64.
  - id: stowry
    ids:
      - stowry
    images:
      - "ghcr.io/sagarc03/stowry"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: Dockerfile
    extra_files:
      - THIRD_PARTY_LICENSES
    platforms:
      - linux/amd64
      - linux/arm64

  - id: stowry-alpine
    ids:
      - stowry
    images:
      - "ghcr.io/sagarc03/stowry"
    tags:
      - "{{ .Tag }}-alpine"
      - "v{{ .Major }}-alpine"
      - "v{{ .Major }}.{{ .Minor }}-alpine"
      - "alpine"
    dockerfile: Dockerfile.alpine
    extra_files:
      - THIRD_PARTY_LICENSES
    platforms:
      - linux/amd64
      - linux/arm64

  - id: stowry-debian
    ids:
      - stowry
    images:
      - "ghcr.io/sagarc03/stowry"
    tags:
      - "{{ .Tag }}-debian"
      - "v{{ .Major }}-debian"
      - "v{{ .Major }}.{{ .Minor }}-debian"
      - "debian"
    dockerfile: Dockerfile.debian
    extra_files:
      - THIRD_PARTY_LICENSES
    platforms:
      - linux/amd64
      - linux/arm64

  - id: stowry-distroless
    ids:
      - stowry
    images:
      - "ghcr.io/sagarc03/stowry"
    tags:
      - "{{ .Tag }}-distroless"
      - "v{{ .Major }}-distroless"
      - "v{{ .Major }}.{{ .Minor }}-distroless"
      - "distroless"
    dockerfile: Dockerfile.distroless
    extra_files:
      - THIRD_PARTY_LICENSES
    platforms:
      - linux/amd64
      - linux/arm64

release:
  github:
    owner: sagarc03
    name: stowry
  draft: false
  prerelease: auto
