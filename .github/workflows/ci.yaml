name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "website/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "website/**"
      - "*.md"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.13"

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      # Apache-2.0 dependencies require their licence to ship with the binary,
      # so a new dependency must not land without its licence.
      - name: Check THIRD_PARTY_LICENSES is current
        run: |
          go-licenses save . --save_path=/tmp/licenses --force --confidence_threshold=0.85
          diff -r THIRD_PARTY_LICENSES /tmp/licenses

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, a failure on one OS cancels the others mid-run and their
      # results are lost - which is exactly when the other OSes matter most.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The PostgreSQL tests need a container runtime, which only GitHub's Ubuntu
      # runners have. They skip themselves elsewhere, so the same command runs
      # on every OS.
      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
        continue-on-error: true

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -o bin/stowry${ext} .

      - name: Verify binaries
        shell: bash
        run: |
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          ./bin/stowry${ext} --version

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds every image variant for every platform through the same pipe the
      # release uses, without pushing. The release Dockerfile had been broken
      # for a full release cycle because nothing built it outside a tag.
      - name: Build images
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # Exercises each variant end to end. `migrate` and `PUT` both write into
      # /data as the image's unprivileged user, so this fails if the data
      # directory is not owned by that user.
      - name: Smoke test images
        run: |
          set -euo pipefail
          for variant in latest alpine debian distroless; do
            image="ghcr.io/sagarc03/stowry:${variant}-amd64"
            volume="smoke-${variant}"

            docker volume create "$volume" > /dev/null
            docker run --rm -v "$volume:/data" "$image" migrate --db-dsn /data/stowry.db
            cid=$(docker run -d -p 5708:5708 -v "$volume:/data" "$image" serve --db-dsn /data/stowry.db)

            # Dump the container's own logs however this variant fails, and
            # clean up either way: set -e would otherwise kill the step at the
            # first failing curl, leaving a bare "exit 22" with no explanation
            # and a container and volume behind on the runner.
            trap 'status=$?; if [ "$status" -ne 0 ]; then echo "::error::$variant image failed"; docker logs "$cid" || true; fi; docker rm -f "$cid" > /dev/null 2>&1 || true; docker volume rm "$volume" > /dev/null 2>&1 || true; exit $status' EXIT

            ready=""
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:5708/; then
                ready=yes
                break
              fi
              sleep 1
            done

            if [ -z "$ready" ]; then
              echo "::error::$variant image never became ready"
              exit 1
            fi

            curl -fsS -X PUT --data-binary "hello from $variant" \
              -H 'Content-Type: text/plain' http://127.0.0.1:5708/smoke.txt > /dev/null
            body=$(curl -fsS http://127.0.0.1:5708/smoke.txt)

            if [ "$body" != "hello from $variant" ]; then
              echo "::error::$variant image served \"$body\""
              exit 1
            fi

            trap - EXIT
            docker rm -f "$cid" > /dev/null
            docker volume rm "$volume" > /dev/null
            echo "$variant: ok"
          done
