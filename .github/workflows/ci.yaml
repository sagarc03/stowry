name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "website/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "website/**"
      - "*.md"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.13"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, a failure on one OS cancels the others mid-run and their
      # results are lost - which is exactly when the other OSes matter most.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # database/postgres and e2e packages use testcontainers-go which requires
      # Docker. Only GitHub's Ubuntu runners have Docker pre-installed; macOS and
      # Windows runners do not, so those packages are excluded on non-Linux OSes.
      - name: Run tests
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run tests (no Docker)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          packages=$(go list ./... | grep -v -E '(database/postgres|e2e)')
          go test -race $packages

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
        continue-on-error: true

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -o bin/stowry${ext} ./cmd/stowry
          CGO_ENABLED=0 go build -o bin/stowry-cli${ext} ./cmd/stowry-cli

      - name: Verify binaries
        shell: bash
        run: |
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          ./bin/stowry${ext} --version
          ./bin/stowry-cli${ext} --version

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds every image variant for every platform through the same pipe the
      # release uses, without pushing. The release Dockerfile had been broken
      # for a full release cycle because nothing built it outside a tag.
      - name: Build images
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # Exercises each variant end to end. `init` and `PUT` both write into
      # /data as the image's unprivileged user, so this fails if the data
      # directory is not owned by that user.
      - name: Smoke test images
        run: |
          set -euo pipefail
          for variant in latest alpine debian distroless; do
            image="ghcr.io/sagarc03/stowry:${variant}-amd64"
            volume="smoke-${variant}"

            docker volume create "$volume" > /dev/null
            docker run --rm -v "$volume:/data" "$image" init --db-dsn /data/stowry.db
            cid=$(docker run -d -p 5708:5708 -v "$volume:/data" "$image" serve --db-dsn /data/stowry.db)

            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:5708/ && break
              sleep 1
            done

            curl -fsS -X PUT --data-binary "hello from $variant" \
              -H 'Content-Type: text/plain' http://127.0.0.1:5708/smoke.txt > /dev/null
            body=$(curl -fsS http://127.0.0.1:5708/smoke.txt)

            if [ "$body" != "hello from $variant" ]; then
              echo "::error::$variant image served \"$body\""
              docker logs "$cid"
              exit 1
            fi

            docker rm -f "$cid" > /dev/null
            docker volume rm "$volume" > /dev/null
            echo "$variant: ok"
          done
